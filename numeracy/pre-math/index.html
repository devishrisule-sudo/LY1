<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>One to One Correspondence</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f2c521;
    font-family:Arial, sans-serif;
    overflow:hidden;
    touch-action:manipulation;
}

/* Splash Screen */

#splash{
    position:fixed;
    inset:0;
    background:#ffffff;
    border:4px solid #ffd400;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#splash img{
    width:220px;
    max-width:75%;
    object-fit:contain;
}

/* Main Sheet */

.game-sheet{
    width:96%;
    height:96vh;
    background:#f4f4f4;
    margin:2vh auto;
    border:3px solid #333;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    padding:10px;
}

/* Top Bar */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:clamp(14px,2vw,20px);
    font-weight:bold;
    margin-bottom:5px;
}

/* Title */

.title-box{
    width:min(280px,90%);
    background:#f2c521;
    margin:8px auto;
    text-align:center;
    padding:10px;
    border:2px solid #333;
    border-radius:14px;
    font-size:clamp(15px,2vw,22px);
    font-weight:bold;
}

/* Instruction */

.instruction{
    text-align:center;
    font-size:clamp(14px,2vw,20px);
    margin:10px 5px;
}

/* Game Area */

#gameArea{
    height:68vh;
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
}

/* Rows */

.row{
    position:relative;
    width:100%;
    height:18vh;
    min-height:90px;
}

/* Images */

.left-img{
    position:absolute;
    left:2%;
    top:50%;
    transform:translateY(-50%);
    width:clamp(50px,8vw,90px);
    height:clamp(50px,8vw,90px);
    object-fit:contain;
    cursor:pointer;
}

.right-img{
    position:absolute;
    right:2%;
    top:50%;
    transform:translateY(-50%);
    width:clamp(45px,7vw,80px);
    height:clamp(45px,7vw,80px);
    object-fit:contain;
    cursor:pointer;
}

/* Dots */

.left-dot{
    position:absolute;
    left:18%;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    background:#888;
    border-radius:50%;
    z-index:2;
}

.right-dot{
    position:absolute;
    right:18%;
    top:50%;
    transform:translateY(-50%);
    width:14px;
    height:14px;
    background:#888;
    border-radius:50%;
    z-index:2;
}

/* Dashed Line */

.dash-line{
    position:absolute;
    left:calc(18% + 14px);
    right:calc(18% + 14px);
    top:50%;
    transform:translateY(-50%);
    border-top:3px dashed #444;
}

/* Green Line */

.green-line{
    position:absolute;
    left:calc(18% + 14px);
    width:0%;
    top:50%;
    transform:translateY(-50%);
    border-top:5px solid green;
    transition:width 0.4s ease;
}

/* Highlights */

.correct{
    outline:3px solid green;
    border-radius:10px;
    background:#eaffea;
}

.wrong{
    outline:3px solid red;
    border-radius:10px;
    background:#ffecec;
}

/* Buttons */

.bottom-bar{
    position:absolute;
    bottom:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

button{
    flex:1;
    max-width:180px;
    padding:10px;
    font-size:clamp(12px,2vw,16px);
    border:none;
    border-radius:10px;
    background:#f2f2f2;
    cursor:pointer;
}

/* End Screen */

#endScreen{
    display:none;
    text-align:center;
    margin-top:25vh;
}

#endScreen h1{
    color:green;
    font-size:clamp(24px,5vw,40px);
    margin-bottom:20px;
}

/* Small Old Mobiles */

@media(max-width:480px){

.game-sheet{
    height:97vh;
    padding:8px;
}

.row{
    height:16vh;
}

.left-dot{
    left:22%;
}

.right-dot{
    right:22%;
}

.dash-line{
    left:calc(22% + 14px);
    right:calc(22% + 14px);
}

.green-line{
    left:calc(22% + 14px);
}

button{
    padding:8px;
}

}

/* Tablets */

@media(min-width:768px){

.row{
    height:16vh;
}

.left-dot{
    left:14%;
}

.right-dot{
    right:14%;
}

.dash-line{
    left:calc(14% + 14px);
    right:calc(14% + 14px);
}

.green-line{
    left:calc(14% + 14px);
}

}

</style>
</head>

<body>

<!-- Splash -->

<div id="splash">

<img src="./assets/innovinelogo.png">

</div>

<!-- Main Sheet -->

<div class="game-sheet">

<div class="topbar">

<div>
Score: <span id="score">0</span>/24
</div>

<div>
Time: <span id="timer">20</span>
</div>

</div>

<div class="title-box">
One to One Correspondence
</div>

<div class="instruction" id="instruction">
Tap on the matching pictures.
</div>

<div id="gameArea"></div>

<div class="bottom-bar">

<button onclick="restartGame()">
Restart
</button>

<button onclick="toggleMute()">
Mute / Unmute
</button>

</div>

<div id="endScreen">

<h1>
You have done a great job!
</h1>

<button onclick="restartGame()">
Play Again
</button>

</div>

</div>

<!-- Audio -->

<audio id="correctSound">
<source src="./assets/correct.mp3" type="audio/mpeg">
</audio>

<audio id="wrongSound">
<source src="./assets/wrong.mp3" type="audio/mpeg">
</audio>

<audio id="clapSound">
<source src="./assets/claps.mp3" type="audio/mpeg">
</audio>

<!-- Confetti -->

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const questions = [

{
instruction:"Tap on the ant and then tap on the apple.",
left:"./assets/ant.png",
right:"./assets/apple.jpg"
},

{
instruction:"Tap on the arrow and then tap on the balloon.",
left:"./assets/arrow.png",
right:"./assets/balloon.png"
},

{
instruction:"Tap on the butterfly and then tap on the flower.",
left:"./assets/butterfly.jpg",
right:"./assets/flower.png"
},

{
instruction:"Tap on the duckling and then tap on the duck.",
left:"./assets/duckling.png",
right:"./assets/duck.png"
},

{
instruction:"Tap on the eagle and then tap on the egg.",
left:"./assets/eagle.png",
right:"./assets/egg.png"
},

{
instruction:"Tap on the monkey and then tap on the banana.",
left:"./assets/monkey.png",
right:"./assets/bananas.jpg"
},

{
instruction:"Tap on the elephant and then tap on the tree.",
left:"./assets/elephant.png",
right:"./assets/green tree.jpg"
},

{
instruction:"Tap on the boy and then tap on the football.",
left:"./assets/boy.png",
right:"./assets/football.png"
}

];

let currentQuestion = 0;
let score = 0;
let timer = 20;
let interval;
let muted = false;
let selectedRow = -1;
let completedRows = [];

const gameArea = document.getElementById("gameArea");

/* Splash */

window.addEventListener("load",()=>{

setTimeout(()=>{

document.getElementById("splash").style.display="none";

loadQuestion();

},10000);

});

/* Load Question */

function loadQuestion(){

if(currentQuestion >= questions.length){

showEnd();

return;

}

selectedRow = -1;
completedRows = [];

const q = questions[currentQuestion];

document.getElementById("instruction").innerText =
q.instruction;

gameArea.innerHTML = "";

for(let i=0;i<3;i++){

gameArea.innerHTML += `

<div class="row">

<img 
src="${q.left}" 
class="left-img"
id="left${i}"
>

<div class="left-dot"></div>

<div class="dash-line"></div>

<div class="green-line" id="line${i}"></div>

<div class="right-dot"></div>

<img 
src="${q.right}" 
class="right-img"
id="right${i}"
>

</div>

`;

}

for(let i=0;i<3;i++){

const left = document.getElementById(`left${i}`);
const right = document.getElementById(`right${i}`);

left.addEventListener("click",()=>{

selectedRow = i;

document.querySelectorAll(".left-img").forEach(img=>{

img.classList.remove("correct");

});

left.classList.add("correct");

});

right.addEventListener("click",()=>{

if(selectedRow === i){

handleCorrect(i);

}
else{

handleWrong(right);

}

});

}

timer = 20;

document.getElementById("timer").innerText = timer;

clearInterval(interval);

interval = setInterval(()=>{

timer--;

document.getElementById("timer").innerText = timer;

if(timer <= 0){

clearInterval(interval);

currentQuestion++;

loadQuestion();

}

},1000);

}

/* Correct */

function handleCorrect(i){

if(completedRows.includes(i)) return;

completedRows.push(i);

document.getElementById(`line${i}`).style.width =
"calc(100% - 198px)";

document.getElementById(`right${i}`).classList.add("correct");

if(!muted){

const correct = document.getElementById("correctSound");

correct.currentTime = 0;

correct.play();

}

confetti({
particleCount:50,
spread:70
});

score++;

document.getElementById("score").innerText = score;

if(completedRows.length === 3){

clearInterval(interval);

setTimeout(()=>{

currentQuestion++;

loadQuestion();

},1200);

}

}

/* Wrong */

function handleWrong(element){

element.classList.add("wrong");

if(!muted){

const wrong = document.getElementById("wrongSound");

wrong.currentTime = 0;

wrong.play();

}

setTimeout(()=>{

element.classList.remove("wrong");

},700);

}

/* Restart */

function restartGame(){

location.reload();

}

/* Mute */

function toggleMute(){

muted = !muted;

}

/* End */

function showEnd(){

gameArea.style.display = "none";

document.querySelector(".instruction").style.display =
"none";

document.querySelector(".bottom-bar").style.display =
"none";

document.getElementById("endScreen").style.display =
"block";

if(!muted){

document.getElementById("clapSound").play();

}

}

</script>

</body>
</html>
