```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One to One Correspondence</title>

<style>

body{
    margin:0;
    background:#f2c521;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* Splash Screen */

#splash{
    position:fixed;
    inset:0;
    background:white;
    border:5px solid yellow;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
}

#splash img{
    width:200px;
}

/* Worksheet */

.game-sheet{
    width:92%;
    height:94vh;
    background:#f4f4f4;
    margin:10px auto;
    border:3px solid #333;
    border-radius:22px;
    position:relative;
    padding:15px 15px 90px 15px;
    box-sizing:border-box;
}

/* Top Bar */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
    font-weight:bold;
}

/* Title */

.title-box{
    width:260px;
    background:#f2c521;
    margin:15px auto;
    text-align:center;
    padding:10px;
    border:2px solid #333;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
}

/* Instruction */

.instruction{
    font-size:16px;
    margin:10px 0 20px 10px;
}

/* Game Area */

#gameArea{
    display:flex;
    flex-direction:column;
    justify-content:space-evenly;
    height:65vh;
}

/* Row */

.row{
    position:relative;
    width:100%;
    height:110px;
}

/* Left Image */

.left-img{
    position:absolute;
    left:5px;
    top:15px;
    width:75px;
    height:75px;
    object-fit:contain;
    cursor:pointer;
}

/* Right Image */

.right-img{
    position:absolute;
    right:5px;
    top:15px;
    width:60px;
    height:60px;
    object-fit:contain;
    cursor:pointer;
}

/* Dots */

.left-dot{
    position:absolute;
    left:100px;
    top:45px;
    width:14px;
    height:14px;
    background:#999;
    border-radius:50%;
    z-index:2;
}

.right-dot{
    position:absolute;
    right:100px;
    top:45px;
    width:14px;
    height:14px;
    background:#999;
    border-radius:50%;
    z-index:2;
}

/* Dashed Line */

.dash-line{
    position:absolute;
    left:114px;
    right:114px;
    top:51px;
    border-top:3px dashed #444;
    z-index:1;
}

/* Green Line */

.green-line{
    position:absolute;
    left:114px;
    width:0%;
    top:51px;
    border-top:5px solid green;
    transition:width 0.4s;
    z-index:1;
}

/* Highlights */

.selected{
    transform:scale(1.05);
}

.correct{
    outline:3px solid green;
    border-radius:10px;
    background:#eaffea;
}

.wrong{
    outline:3px solid red;
    border-radius:10px;
    background:#ffecec;
}

/* Bottom Buttons */

.bottom-bar{
    position:absolute;
    bottom:18px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
}

button{
    padding:8px 18px;
    font-size:15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

/* End Screen */

#endScreen{
    display:none;
    text-align:center;
    margin-top:120px;
}

#endScreen h1{
    color:green;
    font-size:34px;
}

</style>
</head>

<body>

<!-- Splash -->

<div id="splash">
<img src="./assets/innovine_logo.png">
</div>

<!-- Worksheet -->

<div class="game-sheet">

<!-- Top -->

<div class="topbar">

<div>
Score: <span id="score">0</span>/8
</div>

<div>
Time: <span id="timer">20</span>
</div>

</div>

<!-- Title -->

<div class="title-box">
One to One Correspondence
</div>

<!-- Instruction -->

<div class="instruction">
Tap on the matching pictures.
</div>

<!-- Game Area -->

<div id="gameArea"></div>

<!-- Buttons -->

<div class="bottom-bar">

<button onclick="restartGame()">
Restart
</button>

<button onclick="toggleMute()">
Mute / Unmute
</button>

</div>

<!-- End Screen -->

<div id="endScreen">

<h1>
You have done a great job!
</h1>

<button onclick="restartGame()">
Play Again
</button>

</div>

</div>

<!-- Audio -->

<audio id="correctSound">
<source src="./assets/correct.mp3" type="audio/mpeg">
</audio>

<audio id="wrongSound">
<source src="./assets/wrong.mp3" type="audio/mpeg">
</audio>

<!-- Confetti -->

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* Questions */

const questions = [

{
pairs:[
{
left:"./assets/ant.png",
right:"./assets/apple.jpg"
},
{
left:"./assets/arrow.png",
right:"./assets/balloon.png"
},
{
left:"./assets/butterfly.jpg",
right:"./assets/flower.png"
}
]
},

{
pairs:[
{
left:"./assets/duckling.png",
right:"./assets/duck.png"
},
{
left:"./assets/eagle.png",
right:"./assets/egg.png"
},
{
left:"./assets/monkey.png",
right:"./assets/bananas.jpg"
}
]
},

{
pairs:[
{
left:"./assets/elephant.png",
right:"./assets/green tree.jpg"
},
{
left:"./assets/boy.png",
right:"./assets/football.png"
}
]
}

];

/* Variables */

let currentPage = 0;
let selectedIndex = -1;
let score = 0;
let timer = 20;
let interval;
let muted = false;

const gameArea = document.getElementById("gameArea");

/* Splash */

setTimeout(()=>{

document.getElementById("splash").style.display="none";

loadPage();

},10000);

/* Load Page */

function loadPage(){

if(currentPage >= questions.length){

showEnd();

return;

}

selectedIndex = -1;

gameArea.innerHTML = "";

questions[currentPage].pairs.forEach((pair,index)=>{

gameArea.innerHTML += `

<div class="row">

<img 
src="${pair.left}" 
class="left-img" 
id="left${index}"
>

<div class="left-dot"></div>

<div class="dash-line"></div>

<div class="green-line" id="line${index}"></div>

<div class="right-dot"></div>

<img 
src="${pair.right}" 
class="right-img" 
id="right${index}"
>

</div>

`;

});

/* Events */

questions[currentPage].pairs.forEach((pair,index)=>{

const left = document.getElementById(`left${index}`);
const right = document.getElementById(`right${index}`);

left.addEventListener("click",()=>{

document.querySelectorAll(".left-img").forEach(img=>{

img.classList.remove("selected");

});

left.classList.add("selected");

selectedIndex = index;

});

right.addEventListener("click",()=>{

if(selectedIndex === index){

handleCorrect(index);

}
else{

handleWrong(right);

}

});

});

/* Timer */

timer = 20;

document.getElementById("timer").innerText = timer;

clearInterval(interval);

interval = setInterval(()=>{

timer--;

document.getElementById("timer").innerText = timer;

if(timer <= 0){

clearInterval(interval);

currentPage++;

loadPage();

}

},1000);

}

/* Correct */

function handleCorrect(index){

document.getElementById(`line${index}`).style.width =
"calc(100% - 228px)";

document.getElementById(`right${index}`).classList.add("correct");

document.getElementById(`left${index}`).classList.add("correct");

if(!muted){

const correct = document.getElementById("correctSound");

correct.currentTime = 0;

correct.play();

}

confetti({

particleCount:60,
spread:70

});

score++;

document.getElementById("score").innerText = score;

/* Check Completed */

setTimeout(()=>{

let completed = true;

questions[currentPage].pairs.forEach((pair,i)=>{

if(document.getElementById(`line${i}`).style.width !==
"calc(100% - 228px)"){

completed = false;

}

});

if(completed){

currentPage++;

loadPage();

}

},800);

}

/* Wrong */

function handleWrong(element){

element.classList.add("wrong");

if(!muted){

const wrong = document.getElementById("wrongSound");

wrong.currentTime = 0;

wrong.play();

}

setTimeout(()=>{

element.classList.remove("wrong");

},700);

}

/* Restart */

function restartGame(){

location.reload();

}

/* Mute */

function toggleMute(){

muted = !muted;

}

/* End */

function showEnd(){

gameArea.style.display = "none";

document.querySelector(".instruction").style.display = "none";

document.querySelector(".bottom-bar").style.display = "none";

document.getElementById("endScreen").style.display = "block";

}

</script>

</body>
</html>
```
