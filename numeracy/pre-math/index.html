<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One to One Correspondence</title>

<style>

body{
    margin:0;
    background:#f2c521;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

/* Splash Screen */

#splash{
    position:fixed;
    inset:0;
    background:#ffffff;
    border:5px solid #ffd400;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#logo{
    width:260px;
    height:auto;
    display:block;
    opacity:1;
}

/* Main Worksheet */

.game-sheet{
    width:92%;
    height:94vh;
    background:#f4f4f4;
    margin:10px auto;
    border:3px solid #333;
    border-radius:22px;
    position:relative;
    padding:15px 15px 90px 15px;
    box-sizing:border-box;
}

/* Top Bar */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
    font-weight:bold;
}

/* Title */

.title-box{
    width:260px;
    background:#f2c521;
    margin:15px auto;
    text-align:center;
    padding:10px;
    border:2px solid #333;
    border-radius:14px;
    font-size:18px;
    font-weight:bold;
}

/* Instruction */

.instruction{
    font-size:18px;
    margin:20px 0 30px 10px;
}

/* Game Area */

#gameArea{
    height:55vh;
    position:relative;
}

/* Row */

.row{
    position:relative;
    width:100%;
    height:160px;
}

/* Images */

.left-img{
    position:absolute;
    left:10px;
    top:20px;
    width:90px;
    height:90px;
    object-fit:contain;
    cursor:pointer;
}

.right-img{
    position:absolute;
    right:10px;
    top:20px;
    width:80px;
    height:80px;
    object-fit:contain;
    cursor:pointer;
}

/* Dots */

.left-dot{
    position:absolute;
    left:120px;
    top:58px;
    width:16px;
    height:16px;
    background:#999;
    border-radius:50%;
    z-index:2;
}

.right-dot{
    position:absolute;
    right:120px;
    top:58px;
    width:16px;
    height:16px;
    background:#999;
    border-radius:50%;
    z-index:2;
}

/* Dashed Line */

.dash-line{
    position:absolute;
    left:136px;
    right:136px;
    top:66px;
    border-top:3px dashed #444;
}

/* Green Line */

.green-line{
    position:absolute;
    left:136px;
    width:0%;
    top:66px;
    border-top:5px solid green;
    transition:width 0.4s;
}

/* Correct */

.correct{
    outline:3px solid green;
    border-radius:10px;
    background:#eaffea;
}

/* Wrong */

.wrong{
    outline:3px solid red;
    border-radius:10px;
    background:#ffecec;
}

/* Buttons */

.bottom-bar{
    position:absolute;
    bottom:18px;
    left:20px;
    right:20px;
    display:flex;
    justify-content:space-between;
}

button{
    padding:8px 18px;
    font-size:15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

/* End Screen */

#endScreen{
    display:none;
    text-align:center;
    margin-top:140px;
}

#endScreen h1{
    color:green;
    font-size:34px;
}

</style>
</head>

<body>

<!-- Splash Screen -->

<div id="splash">

<img 
id="logo"
src="./assets/innovine_logo.png"
alt="Innovine Logo"
>

</div>

<!-- Main Worksheet -->

<div class="game-sheet">

<!-- Top -->

<div class="topbar">

<div>
Score: <span id="score">0</span>/8
</div>

<div>
Time: <span id="timer">20</span>
</div>

</div>

<!-- Title -->

<div class="title-box">
One to One Correspondence
</div>

<!-- Instruction -->

<div class="instruction" id="instruction">
Tap on the matching pictures.
</div>

<!-- Game Area -->

<div id="gameArea"></div>

<!-- Buttons -->

<div class="bottom-bar">

<button onclick="restartGame()">
Restart
</button>

<button onclick="toggleMute()">
Mute / Unmute
</button>

</div>

<!-- End Screen -->

<div id="endScreen">

<h1>
You have done a great job!
</h1>

<button onclick="restartGame()">
Play Again
</button>

</div>

</div>

<!-- Audio -->

<audio id="correctSound">
<source src="./assets/correct.mp3" type="audio/mpeg">
</audio>

<audio id="wrongSound">
<source src="./assets/wrong.mp3" type="audio/mpeg">
</audio>

<!-- Confetti -->

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

/* Questions */

const questions = [

{
instruction:"Tap on the ant and then tap on the apple.",
left:"./assets/ant.png",
right:"./assets/apple.jpg"
},

{
instruction:"Tap on the arrow and then tap on the balloon.",
left:"./assets/arrow.png",
right:"./assets/balloon.png"
},

{
instruction:"Tap on the butterfly and then tap on the flower.",
left:"./assets/butterfly.jpg",
right:"./assets/flower.png"
},

{
instruction:"Tap on the duckling and then tap on the duck.",
left:"./assets/duckling.png",
right:"./assets/duck.png"
},

{
instruction:"Tap on the eagle and then tap on the egg.",
left:"./assets/eagle.png",
right:"./assets/egg.png"
},

{
instruction:"Tap on the monkey and then tap on the banana.",
left:"./assets/monkey.png",
right:"./assets/bananas.jpg"
},

{
instruction:"Tap on the elephant and then tap on the tree.",
left:"./assets/elephant.png",
right:"./assets/green tree.jpg"
},

{
instruction:"Tap on the boy and then tap on the football.",
left:"./assets/boy.png",
right:"./assets/football.png"
}

];

/* Variables */

let currentQuestion = 0;
let score = 0;
let timer = 20;
let interval;
let muted = false;
let selected = false;

const gameArea = document.getElementById("gameArea");

/* Splash Screen */

window.addEventListener("load",()=>{

const splash = document.getElementById("splash");

setTimeout(()=>{

splash.style.display = "none";

loadQuestion();

},10000);

});

/* Load Question */

function loadQuestion(){

if(currentQuestion >= questions.length){

showEnd();

return;

}

selected = false;

const q = questions[currentQuestion];

document.getElementById("instruction").innerText = q.instruction;

gameArea.innerHTML = `

<div class="row">

<img 
src="${q.left}" 
class="left-img" 
id="leftImg"
>

<div class="left-dot"></div>

<div class="dash-line"></div>

<div class="green-line" id="greenLine"></div>

<div class="right-dot"></div>

<img 
src="${q.right}" 
class="right-img" 
id="rightImg"
>

</div>

`;

const leftImg = document.getElementById("leftImg");
const rightImg = document.getElementById("rightImg");

leftImg.addEventListener("click",()=>{

selected = true;

leftImg.classList.add("correct");

});

rightImg.addEventListener("click",()=>{

if(selected){

handleCorrect();

}
else{

handleWrong();

}

});

timer = 20;

document.getElementById("timer").innerText = timer;

clearInterval(interval);

interval = setInterval(()=>{

timer--;

document.getElementById("timer").innerText = timer;

if(timer <= 0){

clearInterval(interval);

currentQuestion++;

loadQuestion();

}

},1000);

}

/* Correct */

function handleCorrect(){

document.getElementById("greenLine").style.width =
"calc(100% - 272px)";

document.getElementById("rightImg").classList.add("correct");

if(!muted){

const correct = document.getElementById("correctSound");

correct.currentTime = 0;

correct.play();

}

confetti({

particleCount:70,
spread:80

});

score++;

document.getElementById("score").innerText = score;

clearInterval(interval);

setTimeout(()=>{

currentQuestion++;

loadQuestion();

},1200);

}

/* Wrong */

function handleWrong(){

document.getElementById("rightImg").classList.add("wrong");

if(!muted){

const wrong = document.getElementById("wrongSound");

wrong.currentTime = 0;

wrong.play();

}

setTimeout(()=>{

document.getElementById("rightImg").classList.remove("wrong");

},700);

}

/* Restart */

function restartGame(){

location.reload();

}

/* Mute */

function toggleMute(){

muted = !muted;

}

/* End */

function showEnd(){

gameArea.style.display = "none";

document.querySelector(".instruction").style.display = "none";

document.querySelector(".bottom-bar").style.display = "none";

document.getElementById("endScreen").style.display = "block";

}

</script>

</body>
</html>
