<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One to One Correspondence</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#e2b71c;
}

.game-container{
    max-width:500px;
    margin:auto;
    background:#efefef;
    min-height:100vh;
    padding:12px;
    box-sizing:border-box;
    border-radius:14px;
}

.title-box{
    background:#f4c400;
    width:260px;
    margin:auto;
    text-align:center;
    padding:10px;
    border-radius:0 0 14px 14px;
    font-size:28px;
    font-weight:bold;
    border:2px solid #444;
}

.instruction{
    margin-top:18px;
    font-size:20px;
    text-align:left;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
    font-size:18px;
    font-weight:bold;
}

.question,
.score{
    background:#fff;
    padding:6px 14px;
    border-radius:10px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:45px 0;
    position:relative;
}

.rabbit{
    width:80px;
    height:80px;
    object-fit:contain;
    cursor:pointer;
}

.carrot{
    width:60px;
    height:60px;
    object-fit:contain;
    cursor:pointer;
}

.line-area{
    flex:1;
    margin:0 12px;
    position:relative;
    height:10px;
}

.dotted{
    border-top:4px dashed #000;
    width:100%;
    position:absolute;
    top:50%;
    transform:translateY(-50%);
}

.draw-line{
    position:absolute;
    top:50%;
    left:0;
    height:6px;
    width:0%;
    background:green;
    transform:translateY(-50%);
    transition:0.5s;
    border-radius:10px;
}

.feedback{
    text-align:center;
    min-height:30px;
    font-size:22px;
    font-weight:bold;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    background:green;
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.correct-highlight{
    border:4px solid green;
    border-radius:50%;
}

.wrong-highlight{
    border:4px solid red;
    border-radius:50%;
}

#confetti{
    text-align:center;
    font-size:35px;
}

@media(max-width:600px){

    .title-box{
        width:220px;
        font-size:22px;
    }

    .instruction{
        font-size:18px;
    }

    .rabbit{
        width:70px;
        height:70px;
    }

    .carrot{
        width:50px;
        height:50px;
    }

}

</style>
</head>

<body>

<div class="game-container">

<div class="title-box">
One to One Correspondence
</div>

<div class="instruction">
Take the cat to the arrow by tracing a line.
</div>

<div class="top-bar">
<div class="question" id="questionNo">Q 1 / 5</div>
<div class="score" id="score">Score : 0</div>
</div>

<div id="gameArea"></div>

<div id="confetti"></div>

<div class="feedback" id="feedback"></div>

<div class="controls">
<button onclick="restartGame()">Restart</button>
<button onclick="toggleSound()">Mute / Unmute</button>
</div>

</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

let currentQuestion = 0;
let totalQuestions = 5;
let score = 0;
let selectedRabbit = null;
let soundOn = true;

let attempts = [0,0,0];
let completed = [false,false,false];

function loadQuestion(){

    document.getElementById("feedback").innerHTML = "";
    document.getElementById("confetti").innerHTML = "";

    attempts = [0,0,0];
    completed = [false,false,false];
    selectedRabbit = null;

    document.getElementById("questionNo").innerHTML =
    "Q " + (currentQuestion + 1) + " / " + totalQuestions;

    let html = "";

    for(let i=0;i<3;i++){

        html += `

        <div class="row">

            <img src="assets/Cat.png"
            class="rabbit"
            id="rabbit${i}"
            onclick="selectRabbit(${i})">

            <div class="line-area">

                <div class="dotted"></div>

                <div class="draw-line"
                id="line${i}"></div>

            </div>

            <img src="assets/Arrow.png"
            class="carrot"
            id="carrot${i}"
            onclick="matchCarrot(${i})">

        </div>

        `;
    }

    document.getElementById("gameArea").innerHTML = html;

}

function selectRabbit(index){

    selectedRabbit = index;

    document.querySelectorAll(".rabbit")
    .forEach(item=>{
        item.classList.remove("correct-highlight");
        item.classList.remove("wrong-highlight");
    });

    document.querySelectorAll(".carrot")
    .forEach(item=>{
        item.classList.remove("wrong-highlight");
    });

    document.getElementById("rabbit"+index)
    .classList.add("correct-highlight");

}

function matchCarrot(index){

    if(selectedRabbit === null){
        showFeedback("Select the cat first");
        return;
    }

    if(completed[index]){
        return;
    }

    if(selectedRabbit === index){

        completed[index] = true;

        document.getElementById("line"+index)
        .style.width = "100%";

        document.getElementById("rabbit"+index)
        .classList.add("correct-highlight");

        document.getElementById("carrot"+index)
        .classList.add("correct-highlight");

        score++;

        updateScore();

        playSound("correct");

        showFeedback("Great Job! 🎉");

        showConfetti();

        checkComplete();

    }else{

        attempts[index]++;

        playSound("wrong");

        document.getElementById("carrot"+index)
        .classList.add("wrong-highlight");

        if(attempts[index] === 1){

            showFeedback("Hint : Match the same row");

        }else{

            showFeedback("Correct answer shown");

            completed[index] = true;

            document.getElementById("line"+index)
            .style.width = "100%";

            document.getElementById("rabbit"+index)
            .classList.add("correct-highlight");

            document.getElementById("carrot"+index)
            .classList.add("correct-highlight");

            checkComplete();
        }

    }

    selectedRabbit = null;

}

function checkComplete(){

    if(completed.every(item => item === true)){

        setTimeout(()=>{

            currentQuestion++;

            if(currentQuestion < totalQuestions){

                loadQuestion();

            }else{

                endGame();

            }

        },1200);

    }

}

function showFeedback(message){

    document.getElementById("feedback")
    .innerHTML = message;

}

function showConfetti(){

    document.getElementById("confetti")
    .innerHTML = "🎉 🎉 🎉";

    setTimeout(()=>{
        document.getElementById("confetti")
        .innerHTML = "";
    },1000);

}

function updateScore(){

    document.getElementById("score")
    .innerHTML = "Score : " + score;

}

function playSound(type){

    if(!soundOn) return;

    if(type === "correct"){

        document.getElementById("correctSound").play();

    }else{

        document.getElementById("wrongSound").play();

    }

}

function toggleSound(){

    soundOn = !soundOn;

}

function restartGame(){

    currentQuestion = 0;
    score = 0;

    updateScore();

    loadQuestion();

}

function endGame(){

    document.getElementById("gameArea").innerHTML = "";

    document.getElementById("feedback")
    .innerHTML =
    "Game Over! Final Score : " + score + " / 15";

}

loadQuestion();

</script>

</body>
</html>
