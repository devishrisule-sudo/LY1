<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One to One Correspondence</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    background:#f4c430;
    overflow:hidden;
}

#logoScreen,
#gameContainer,
#endScreen{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#logoScreen{
    background:#f4c430;
}

#logoScreen img{
    width:220px;
    max-width:80%;
}

#gameContainer{
    display:none;
    padding:10px;
}

.game-box{
    width:95%;
    max-width:900px;
    background:#fff;
    border-radius:20px;
    border:3px solid #555;
    padding:20px;
    position:relative;
}

.header{
    text-align:center;
    background:#f4c430;
    border:2px solid #555;
    border-radius:15px;
    padding:10px;
    font-size:28px;
    font-weight:bold;
    margin-bottom:20px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
    flex-wrap:wrap;
    gap:10px;
}

.score,
.timer{
    font-size:20px;
    font-weight:bold;
}

.controls button{
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#f4c430;
    cursor:pointer;
    font-weight:bold;
}

.instruction{
    font-size:22px;
    margin-bottom:30px;
    text-align:center;
}

.question-area{
    width:100%;
    position:relative;
    min-height:300px;
}

.match-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:40px 0;
    position:relative;
}

.left-image,
.right-image{
    width:120px;
    height:120px;
    object-fit:contain;
    z-index:2;
}

.dotted-line{
    position:absolute;
    left:150px;
    right:150px;
    top:50%;
    border-top:4px dashed #555;
    transform:translateY(-50%);
}

.dot-left,
.dot-right{
    width:18px;
    height:18px;
    background:#999;
    border-radius:50%;
    position:absolute;
    top:50%;
    transform:translateY(-50%);
}

.dot-left{
    left:140px;
}

.dot-right{
    right:140px;
}

.drop-zone{
    border-radius:15px;
}

.correct{
    box-shadow:0 0 20px green;
    border:4px solid green;
}

.wrong{
    box-shadow:0 0 20px red;
    border:4px solid red;
}

.hint{
    animation:glow 1s infinite alternate;
}

@keyframes glow{
    from{
        box-shadow:0 0 10px yellow;
    }
    to{
        box-shadow:0 0 25px orange;
    }
}

#feedback{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:30px;
    font-weight:bold;
    color:green;
}

#endScreen{
    display:none;
    text-align:center;
    background:#f4c430;
}

#endScreen h1{
    font-size:45px;
    margin-bottom:20px;
}

#endScreen button{
    padding:15px 25px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:#fff;
    cursor:pointer;
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    background:red;
    top:-10px;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    to{
        transform:translateY(100vh) rotate(720deg);
    }
}

@media(max-width:768px){

    .header{
        font-size:22px;
    }

    .instruction{
        font-size:18px;
    }

    .left-image,
    .right-image{
        width:90px;
        height:90px;
    }

    .dotted-line{
        left:110px;
        right:110px;
    }

    .dot-left{
        left:100px;
    }

    .dot-right{
        right:100px;
    }
}
</style>
</head>

<body>

<!-- Logo Screen -->
<div id="logoScreen">
    <img src="assets/innovine-logo.png">
</div>

<!-- Game Screen -->
<div id="gameContainer">
    <div class="game-box">

        <div class="header">
            One to One Correspondence
        </div>

        <div class="top-bar">
            <div class="score">Score: <span id="score">0</span>/8</div>
            <div class="timer">Time: <span id="time">20</span></div>

            <div class="controls">
                <button onclick="restartGame()">Restart</button>
                <button onclick="toggleMute()" id="muteBtn">Mute</button>
            </div>
        </div>

        <div class="instruction" id="instruction"></div>

        <div class="question-area">

            <div class="match-row">

                <img id="dragItem"
                    class="left-image"
                    draggable="true">

                <div class="dotted-line"></div>

                <div class="dot-left"></div>
                <div class="dot-right"></div>

                <img id="dropZone"
                    class="right-image drop-zone">

            </div>

        </div>

        <div id="feedback"></div>

    </div>
</div>

<!-- End Screen -->
<div id="endScreen">
    <h1>🎉 You have done a great job! 🎉</h1>
    <button onclick="restartGame()">Play Again</button>
</div>

<!-- Audio -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

const questions = [

{
instruction:"Click on the ant and drag it to the apple.",
left:"assets/ant.png",
right:"assets/apple.jpg"
},

{
instruction:"Click on the arrow and drag it to the balloon.",
left:"assets/arrow.png",
right:"assets/balloon.jpg"
},

{
instruction:"Click on the butterfly and drag it to the flower.",
left:"assets/butterfly.jpg",
right:"assets/flower.png"
},

{
instruction:"Click on the duckling and drag it to the duck.",
left:"assets/duckling.png",
right:"assets/duck.png"
},

{
instruction:"Click on the eagle and drag it to the egg.",
left:"assets/eagle.png",
right:"assets/egg.png"
},

{
instruction:"Click on the monkey and drag it to the banana.",
left:"assets/monkey.png",
right:"assets/banana.png"
},

{
instruction:"Click on the elephant and drag it to the tree.",
left:"assets/elephant.png",
right:"assets/tree.jpg"
},

{
instruction:"Click on the boy and drag it to the football.",
left:"assets/boy.jpg",
right:"assets/football.png"
}

];

let currentQuestion = 0;
let score = 0;
let attempts = 0;
let timer;
let timeLeft = 20;
let muted = false;

const instruction = document.getElementById("instruction");
const dragItem = document.getElementById("dragItem");
const dropZone = document.getElementById("dropZone");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

setTimeout(() => {

document.getElementById("logoScreen").style.display = "none";
document.getElementById("gameContainer").style.display = "flex";

loadQuestion();

},5000);

function loadQuestion(){

clearInterval(timer);

timeLeft = 20;
timeText.innerText = timeLeft;

timer = setInterval(() => {

timeLeft--;
timeText.innerText = timeLeft;

if(timeLeft <= 0){
clearInterval(timer);
showCorrectAnswer();
}

},1000);

attempts = 0;

let q = questions[currentQuestion];

instruction.innerText = q.instruction;

dragItem.src = q.left;
dropZone.src = q.right;

dragItem.style.position = "relative";
dragItem.style.left = "0px";
dragItem.style.top = "0px";

dropZone.classList.remove("correct","wrong","hint");

}

dragItem.addEventListener("dragstart",(e)=>{
e.dataTransfer.setData("text","");
});

dropZone.addEventListener("dragover",(e)=>{
e.preventDefault();
});

dropZone.addEventListener("drop",(e)=>{

e.preventDefault();

if(attempts === 0){

correctAnswer();

}else{

showCorrectAnswer();

}

});

function correctAnswer(){

clearInterval(timer);

score++;
scoreText.innerText = score;

dropZone.classList.add("correct");

if(!muted){
correctSound.play();
}

showConfetti();

document.getElementById("feedback").innerText = "Great Job!";

setTimeout(()=>{

document.getElementById("feedback").innerText = "";

currentQuestion++;

if(currentQuestion < questions.length){

loadQuestion();

}else{

endGame();

}

},2000);

}

function wrongAnswer(){

attempts++;

dropZone.classList.add("wrong");

if(!muted){
wrongSound.play();
}

if(attempts === 1){

dropZone.classList.add("hint");

}else{

showCorrectAnswer();

}

}

function showCorrectAnswer(){

clearInterval(timer);

dropZone.classList.add("correct");

setTimeout(()=>{

currentQuestion++;

if(currentQuestion < questions.length){

loadQuestion();

}else{

endGame();

}

},2000);

}

function endGame(){

document.getElementById("gameContainer").style.display = "none";
document.getElementById("endScreen").style.display = "flex";

showConfetti();

}

function restartGame(){

location.reload();

}

function toggleMute(){

muted = !muted;

document.getElementById("muteBtn").innerText = muted ? "Unmute" : "Mute";

}

function showConfetti(){

for(let i=0;i<50;i++){

let confetti = document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left = Math.random()*100 + "vw";

confetti.style.background =
`hsl(${Math.random()*360},100%,50%)`;

confetti.style.animationDuration =
(Math.random()*3+2)+"s";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},5000);

}

}

</script>

</body>
</html>
