<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One to One Correspondence</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#e0b81d;
}

.game-container{
    max-width:500px;
    margin:auto;
    background:#ececec;
    min-height:100vh;
    padding:12px;
    box-sizing:border-box;
    border-radius:14px;
}

.title-box{
    background:#f4c400;
    width:240px;
    margin:auto;
    text-align:center;
    padding:10px;
    border-radius:0 0 14px 14px;
    font-size:22px;
    font-weight:bold;
    border:2px solid #444;
}

.instruction{
    margin-top:18px;
    font-size:18px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    margin-top:15px;
}

.question,
.score{
    background:white;
    padding:6px 14px;
    border-radius:10px;
    font-weight:bold;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:55px 0;
}

.left-image{
    width:70px;
    height:70px;
    object-fit:contain;
    cursor:pointer;
}

.right-image{
    width:60px;
    height:60px;
    object-fit:contain;
    cursor:pointer;
}

.line-area{
    flex:1;
    margin:0 10px;
    position:relative;
}

.dotted{
    border-top:4px dashed #000;
}

.draw-line{
    position:absolute;
    top:-2px;
    left:0;
    height:5px;
    width:0%;
    background:green;
    transition:0.5s;
    border-radius:10px;
}

.correct{
    border:4px solid green;
    border-radius:50%;
}

.wrong{
    border:4px solid red;
    border-radius:50%;
}

.feedback{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    min-height:30px;
}

#confetti{
    text-align:center;
    font-size:30px;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:12px;
    background:green;
    color:white;
    font-size:18px;
}

</style>
</head>

<body>

<div class="game-container">

<div class="title-box">
One to One Correspondence
</div>

<div class="instruction" id="instruction">
Match the objects by tracing a line.
</div>

<div class="top-bar">
<div class="question" id="questionNo">Q 1 / 5</div>
<div class="score" id="score">Score : 0</div>
</div>

<div id="gameArea"></div>

<div id="confetti"></div>

<div class="feedback" id="feedback"></div>

<div class="controls">
<button onclick="restartGame()">Restart</button>
<button onclick="toggleSound()">Mute / Unmute</button>
</div>

</div>

<audio id="correctSound" src="./assets/correct.mp3"></audio>
<audio id="wrongSound" src="./assets/wrong.mp3"></audio>

<script>

const questions = [

{
left:"Cat.png",
right:"Arrow.png",
instruction:"Take the cat to the arrow by tracing a line."
},

{
left:"Apple.jpg",
right:"Ball.png",
instruction:"Take the apple to the ball by tracing a line."
},

{
left:"Duck.png",
right:"Balloon.jpg",
instruction:"Take the duck to the balloon by tracing a line."
},

{
left:"Butterfly.jpg",
right:"Flower.png",
instruction:"Take the butterfly to the flower by tracing a line."
},

{
left:"Ant.png",
right:"Cherry.png",
instruction:"Take the ant to the cherry by tracing a line."
}

];

let currentQuestion = 0;
let score = 0;
let selected = null;
let soundOn = true;

let attempts = [0,0,0];
let completed = [false,false,false];

function loadQuestion(){

    let q = questions[currentQuestion];

    document.getElementById("instruction")
    .innerHTML = q.instruction;

    document.getElementById("questionNo")
    .innerHTML =
    "Q " + (currentQuestion+1) + " / 5";

    document.getElementById("feedback").innerHTML = "";
    document.getElementById("confetti").innerHTML = "";

    attempts = [0,0,0];
    completed = [false,false,false];

    let html = "";

    for(let i=0;i<3;i++){

        html += `

        <div class="row">

        <img
        src="./assets/${q.left}"
        class="left-image"
        id="left${i}"
        onclick="selectObject(${i})">

        <div class="line-area">

        <div class="dotted"></div>

        <div class="draw-line"
        id="line${i}"></div>

        </div>

        <img
        src="./assets/${q.right}"
        class="right-image"
        id="right${i}"
        onclick="matchObject(${i})">

        </div>

        `;
    }

    document.getElementById("gameArea").innerHTML = html;

}

function selectObject(index){

    selected = index;

}

function matchObject(index){

    if(selected === null){

        showFeedback("Select the object first");
        return;

    }

    if(completed[index]) return;

    if(selected === index){

        completed[index] = true;

        document.getElementById("line"+index)
        .style.width = "100%";

        document.getElementById("left"+index)
        .classList.add("correct");

        document.getElementById("right"+index)
        .classList.add("correct");

        playSound("correct");

        score++;

        updateScore();

        showFeedback("Great Job! 🎉");

        showConfetti();

        checkNext();

    }else{

        attempts[index]++;

        playSound("wrong");

        document.getElementById("right"+index)
        .classList.add("wrong");

        if(attempts[index] === 1){

            showFeedback("Hint : Match the same row");

        }else{

            completed[index] = true;

            document.getElementById("line"+index)
            .style.width = "100%";

            document.getElementById("left"+index)
            .classList.add("correct");

            document.getElementById("right"+index)
            .classList.add("correct");

            showFeedback("Correct answer shown");

            checkNext();

        }

    }

    selected = null;

}

function checkNext(){

    if(completed.every(v=>v===true)){

        setTimeout(()=>{

            currentQuestion++;

            if(currentQuestion < questions.length){

                loadQuestion();

            }else{

                endGame();

            }

        },1200);

    }

}

function updateScore(){

    document.getElementById("score")
    .innerHTML = "Score : " + score;

}

function showFeedback(msg){

    document.getElementById("feedback")
    .innerHTML = msg;

}

function showConfetti(){

    document.getElementById("confetti")
    .innerHTML = "🎉 🎉 🎉";

    setTimeout(()=>{

        document.getElementById("confetti")
        .innerHTML = "";

    },1000);

}

function playSound(type){

    if(!soundOn) return;

    if(type === "correct"){

        document.getElementById("correctSound").play();

    }else{

        document.getElementById("wrongSound").play();

    }

}

function toggleSound(){

    soundOn = !soundOn;

}

function restartGame(){

    currentQuestion = 0;
    score = 0;

    updateScore();

    loadQuestion();

}

function endGame(){

    document.getElementById("gameArea").innerHTML = "";

    document.getElementById("feedback")
    .innerHTML =
    "Game Over! Final Score : " + score + " / 15";

}

loadQuestion();

</script>

</body>
</html>
